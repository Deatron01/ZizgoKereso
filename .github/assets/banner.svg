<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Zizgő Kereső — Where's Zizgő? Finding one figure in a busy photo.">
  <title>Zizgő Kereső — Where's Zizgő? Finding one figure in a busy photo.</title>
  <defs>
