      <stop offset="0" stop-color="#7d3de8" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#7d3de8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#7d3de8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: italic 700 98px Georgia, 'Times New Roman', 'Noto Serif', serif; fill: #f3ede2; }
    .tagline { font: 400 21px 'Courier New', Courier, 'Liberation Mono', monospace; fill: #f3ede2; opacity: .82; letter-spacing: 1px; }
    .tag { font: 400 17px 'Courier New', Courier, 'Liberation Mono', monospace; fill: #f3ede2; opacity: .7; letter-spacing: 4px; }
    .swash { fill: none; stroke: #7d3de8; stroke-width: 6; stroke-linecap: round;
             stroke-dasharray: 607; stroke-dashoffset: 607;
             animation: draw 2.2s cubic-bezier(.6,0,.2,1) .3s forwards; }
    .ring { fill: none; stroke: #9a6ae8; stroke-width: 1.5; opacity: .55;
            stroke-dasharray: 1500; stroke-dashoffset: 1500;
            animation: draw 3.2s cubic-bezier(.6,0,.2,1) .2s forwards; }
    .doodle { fill: none; stroke: #7d3de8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .star { fill: #9a6ae8; transform-box: fill-box; transform-origin: center;
            animation: twinkle 3.2s ease-in-out infinite; }
    .cream { fill: #f3ede2; }
    .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 2.2s; }
    .petal { fill: #9a6ae8; opacity: .5; transform-box: fill-box; transform-origin: center;
             animation: drift 7s ease-in-out infinite; }
    .p2 { animation-delay: 2.3s; fill: #7d3de8; } .p3 { animation-delay: 4.1s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.6) rotate(0deg); }
                         50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(0deg); }
                       50% { transform: translateY(-9px) rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) {
      .swash, .ring { animation: none; stroke-dashoffset: 0; }
      .star { animation: none; opacity: .8; } .petal { animation: none; } }
  </style>
